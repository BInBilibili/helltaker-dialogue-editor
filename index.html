<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HELLTAKER 路 Dialogue Editor</title>
<link rel="icon" href="assets/ui/helltaker-logo.png">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<div id="app">

  <header id="topbar">
    <div class="brand">
      <img class="brand-logo" src="assets/ui/helltaker-logo.png" alt="HELLTAKER">
      <div class="brand-copy">
        <h1>DIALOGUE EDITOR</h1>
        <span>鍚屼汉瀵硅瘽缂栬緫鍣?路 鏈湴宸ュ叿</span>
      </div>
    </div>

    <label class="project-title">
      <span>PROJECT</span>
      <input id="project-title" type="text" maxlength="60" spellcheck="false">
    </label>

    <div class="top-actions">
      <button id="btn-new" class="btn ghost" type="button">鏂板缓</button>
      <button id="btn-import" class="btn ghost" type="button">瀵煎叆</button>
      <button id="btn-export" class="btn primary" type="button">瀵煎嚭 JSON</button>
      <button id="btn-help" class="btn ghost square" type="button" title="浣跨敤璇存槑">?</button>
      <input id="import-file" type="file" accept=".json,application/json" hidden>
    </div>
  </header>

  <main id="workspace">

    <aside id="node-panel" class="panel">
      <div class="panel-head">
        <h2>SCENES</h2>
        <span id="node-count" class="count">0</span>
      </div>
      <div id="node-list" class="node-list"></div>
      <div class="node-add">
        <select id="new-node-type" title="鏂拌妭鐐圭被鍨?>
          <option value="dialogue">瀵硅瘽</option>
          <option value="cutscene">杩囧満</option>
          <option value="title">鏍囬鍗?/option>
          <option value="success">SUCCESS</option>
          <option value="badEnd">BAD END</option>
          <option value="end">缁撴潫</option>
        </select>
        <button id="btn-add-node" class="btn small" type="button">+ 娣诲姞</button>
      </div>
      <div class="panel-foot">
        <button id="btn-save" class="btn small ghost" type="button">淇濆瓨</button>
        <span id="save-status" class="save-status">宸茶浇鍏?/span>
      </div>
    </aside>

    <section id="stage-panel">
      <div class="stage-head">
        <div class="stage-mode">
          <span id="stage-mode-label" class="mode-label">PREVIEW</span>
          <span id="stage-node-label" class="stage-node-label"></span>
        </div>
        <div class="stage-actions">
          <button id="btn-play-here" class="btn small" type="button">浠庡綋鍓嶆挱鏀?/button>
          <button id="btn-play-start" class="btn small primary" type="button">浠庡ご鎾斁</button>
          <button id="btn-stop" class="btn small ghost" type="button" disabled>鍋滄</button>
          <button id="btn-focus" class="btn small ghost" type="button" title="闅愯棌涓や晶闈㈡澘锛屾斁澶ч瑙?>涓撴敞</button>
          <label class="mute"><input id="mute-checkbox" type="checkbox"> 闈欓煶</label>
        </div>
      </div>

      <div class="stage-shell">
        <div id="stage" class="stage">
          <div id="stage-view" class="stage-view"></div>
          <div id="stage-badge" class="stage-badge">PREVIEW</div>
          <div id="game-audio-hud" class="game-audio-hud">
            <button id="btn-game-music" class="game-audio-btn" type="button" aria-pressed="false">
              <span class="ga-label">闊充箰</span><span class="ga-state">鍏?/span>
            </button>
            <button id="btn-game-sfx" class="game-audio-btn" type="button" aria-pressed="false">
              <span class="ga-label">闊虫晥</span><span class="ga-state">鍏?/span>
            </button>
          </div>
        </div>
      </div>

      <div class="stage-foot">
        <span id="stage-hint">閫夋嫨宸︿晶鑺傜偣缂栬緫銆傜偣鍑昏垶鍙版垨鎸夌┖鏍兼帹杩涜瘯鐜┿€?/span>
        <span class="stage-foot-right">16:9 路 鏈湴棰勮</span>
      </div>
    </section>

    <aside id="inspector" class="panel">
      <div class="panel-head">
        <h2>INSPECTOR</h2>
        <span id="inspector-type" class="count"></span>
      </div>
      <div id="inspector-body" class="inspector-body"></div>
    </aside>

  </main>
</div>

<div id="modal-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="app.js?v=5"></script>
</body>
</html>
